function workResults(tasks=filteredTasks(),groups=[['To shape',['draft','planning','clarification','ready']],['In the making',['running','paused','queued']],['Quality & decisions',['qa','review']],['Assembled',['complete','closed']]]){if(!tasks.length)return `<div class="empty large">${icon('search')}<h3 style="margin:12px 0 6px">No work orders found</h3><p>Try a different project, state, or search term.</p>${btn('Clear filters','clear-filters','small','undo','style="margin-top:16px"')}</div>`;return ui.view==='board'?`<div class="board">${groups.map(([label,status])=>{const set=tasks.filter(t=>status.includes(t.status));return `<section class="board-column"><div class="column-head">${label}<span>${set.length}</span></div>${set.map(orderCard).join('')||'<div class="empty">Nothing here yet</div>'}</section>`}).join('')}</div>`:`<div class="panel" style="overflow:auto"><table class="work-table"><thead><tr><th>Work order</th><th>State</th><th>Project</th><th>Demo cost</th></tr></thead><tbody>${tasks.map(t=>`<tr><td><button class="table-order" data-action="open" data-id="${t.id}">${esc(t.title)}</button><div class="tiny muted">${t.id}</div></td><td>${statusPill(t)}</td><td>${project(t.project).name}</td><td>${money(t.spent)}</td></tr>`).join('')}</tbody></table></div>`}
function orderCard(t){const p=project(t.project);return `<button class="order-card" data-action="open" data-id="${t.id}"><span class="card-project"><i class="project-dot" style="--c:${p.color}"></i>${p.name}<span style="margin-left:auto">${t.id}</span></span><h3>${esc(t.title)}</h3>${statusPill(t)}${t.status==='running'?`<div class="track" style="margin-top:14px"><span style="width:${t.progress}%"></span></div>`:''}<span class="card-footer"><span class="mini-crew">${bot('builder','compact')}${bot('inspector','compact')}<span style="margin-left:4px">${t.status==='running'?t.progress+'%':t.autonomy}</span></span><span>${money(t.spent)}</span></span></button>`}
function detail(){const t=task();if(!t){ui.task=null;return factory()}const p=project(t.project);const tabs=[['plan','Blueprint'],['graph','Task graph'],['activity','Activity'],['qa','Quality'],['changes','Changes & PR']];return `<button class="detail-back" data-action="back-factory">${icon('back')}Back to factory</button><div class="detail-title"><div><div class="eyebrow">${p.name} / ${t.id}</div><h1>${esc(t.title)}</h1></div>${statusPill(t)}</div><div class="detail-meta"><span class="row" style="gap:5px">${icon('branch')}${p.repo}</span><span>main → factory/${t.id.toLowerCase()}</span><span class="pill">Demo sandbox</span></div><div class="detail-layout"><div class="grow"><nav class="tabs" aria-label="Work order sections">${tabs.map(([tab,name])=>`<button data-action="tab" data-tab="${tab}" class="${ui.tab===tab?'active':''}" ${ui.tab===tab?'aria-current="page"':''}>${name}${tab==='qa'&&t.status==='qa'?' <span class="danger-text">1</span>':''}</button>`).join('')}</nav>${ui.tab==='plan'?planView(t):ui.tab==='graph'?graphView(t):ui.tab==='activity'?activityView(t):ui.tab==='qa'?qaView(t):changesView(t)}</div><aside class="detail-side" aria-label="Work order configuration"><div class="side-section"><div class="side-label">Your crew for this order</div>${['foreman','architect','builder','inspector'].map(r=>{const id=['builder','inspector'].includes(r)?t[r]:(t.gov||snapshot())[r];return `<div class="agent-line">${bot(r,'compact')}<div><strong>${roles[r].name}</strong><p>${model(id).name}</p></div></div>`}).join('')}<button class="btn text small" style="margin-top:10px;color:var(--violet);padding-left:0" data-action="task-models">${icon('settings')}Task model selection</button></div><div class="side-section"><div class="side-label">Autonomy</div><strong class="small" style="text-transform:capitalize">${t.autonomy}</strong><p class="help" style="margin-top:5px">${autonomyText(t.autonomy)}</p></div><div class="side-section"><div class="side-label">Demo estimate & usage</div><div class="row between"><strong>${money(t.spent)}</strong><span class="tiny muted">of ${money(t.estimate)} estimate</span></div><div class="track" style="margin:10px 0"><span style="width:${Math.min(100,t.spent/t.estimate*100)}%"></span></div><p class="help">Illustrative cost, not provider billing. Hard stop at your monthly cap.</p></div><div class="side-section"><div class="side-label">Repository quality profile</div><p class="small">${p.lang}</p><p class="help" style="margin:5px 0 10px">${qualityCommands(p).map(x=>x[0]).join(' · ')}</p>${btn('View quality contract','quality-contract','small text','shield',`data-id="${p.id}"`)}</div></aside></div>`}
function autonomyText(a){return {guided:'Human approves the plan and every build step. PR decisions always stay human.',assisted:'Approved plans can build and run checks. The crew stops for ambiguity, risk, or a PR decision.',delegated:'Routine work continues after the draft passes Architect review. Ambiguity and PR decisions still need you.'}[a]}
function qualityCommands(p){return p.id==='loan'?[['Unit & integration','go test ./...'],['Race check','go test -race ./...'],['Static analysis','go vet ./...']]:p.id==='atlas'?[['Unit tests','pnpm test'],['Accessibility','pnpm test:a11y'],['Type & lint','pnpm typecheck && pnpm lint']]:[['Unit & integration','cargo test'],['Static analysis','cargo clippy -- -D warnings'],['Formatting','cargo fmt --check']]}
function planView(t){const canApprove=t.status==='ready';return `${t.status==='draft'?`<div class="callout"><div class="row">${bot('foreman','compact')}<strong>Give the crew a clear starting point.</strong></div><p>Foreman will draft a blueprint and a task graph. Architect checks the scope, acceptance criteria, and verification strategy before implementation.</p>${btn('Draft blueprint','draft-plan','violet','spark','style="margin-top:14px"')}</div>`:t.status==='planning'?`<div class="callout"><div class="row">${bot('architect','compact')}<strong>The blueprint is ready for Architect review.</strong></div><p>Reviewing for missing decisions, acceptance coverage, dependency order, and repository-specific checks.</p>${btn('Run Architect review','architect-review','violet','shield','style="margin-top:14px"')}</div>`:t.status==='clarification'?`<div class="callout orange"><div class="row">${bot('architect','compact')}<div><strong>One decision before we build</strong><p>How long should the ${t.project==='loan'?'idempotency key remain valid':'new behavior remain compatible with existing clients'}?</p></div></div><p>Architect won’t guess this contract. Your answer becomes part of the approved blueprint.</p>${btn('Answer clarification','clarify','primary','message','style="margin-top:14px"')}</div>`:canApprove?`<div class="callout green"><div class="row">${bot('architect','compact')}<strong>Architect review passed. Your call.</strong></div><p>The acceptance criteria map to verification steps. Approving locks blueprint v1 and makes this order ready to run.</p><div class="row wrap" style="margin-top:14px">${btn('Approve plan & start','start','primary','play')}${btn('Request plan revision','revise-plan','','message')}</div></div>`:['running','paused','queued','qa','review','complete','closed'].includes(t.status)?`<div class="callout green"><div class="row between"><span class="row" style="gap:8px">${icon('shield')}<strong class="small">Blueprint v${t.revision||1} approved</strong></span><span class="tiny">Architect reviewed</span></div><p>${t.answer?'Decision recorded: '+esc(t.answer):'Scope, dependency graph, and evidence requirements have been reviewed.'}</p></div>`:''}<section class="plan-section"><h3>The outcome</h3><p>${esc(t.brief)}</p></section><section class="plan-section"><h3>Acceptance contract</h3><ul class="check-list">${t.criteria.split(/\.\s*/).filter(Boolean).map(c=>`<li>${icon('circlecheck')}<span>${esc(c)}.</span></li>`).join('')}</ul></section><section class="plan-section"><h3>How the crew will build it</h3><div class="stack" style="gap:10px">${[['1','Reproduce the current failure','Builder writes a failing test against the acceptance contract.'],['2','Implement in an isolated worktree','Implementation and contract tests can proceed after the baseline is recorded.'],['3','Verify, inspect, and bring back evidence','Inspector checks the diff and sandbox evidence. Unresolved findings block the PR decision.']].map(([n,a,b])=>`<div class="row" style="align-items:start"><span class="square" style="width:25px;height:25px;font-size:11px;flex-shrink:0">${n}</span><div><strong class="small">${a}</strong><p class="help">${b}</p></div></div>`).join('')}</div></section><section class="plan-section"><h3>Scope boundaries</h3><p>Preserve existing public contracts. No adjacent refactors or production mutations. New ambiguity returns to the human. Evidence is tied to a specific demo revision.</p></section><button class="artifact-chip" data-action="export-plan">${icon('download')}Download this blueprint as Markdown<span class="grow"></span><span class="muted">.md</span></button>`}
function graphView(t){let done=t.progress>=100,mid=t.progress>=60,started=t.progress>=30,baselineRunning=t.progress>0;return `<div class="section-head"><div><h2>Pieces with a purpose</h2><p class="help" style="margin-top:5px">Dependencies come first. Independent tasks can run in parallel.</p></div><span class="pill">4 tasks</span></div>${runBanner(t)}<div class="graph-canvas"><div class="graph"><button class="node ${started?'done':baselineRunning?'running':''}" data-action="node" data-node="baseline"><span class="pill ${started?'green':baselineRunning?'purple':''}">${started?'Verified':baselineRunning?'In progress':'Waiting'}</span><strong>Failing baseline</strong><small>Builder · acceptance test</small></button><span class="graph-edge split ${started?'flow':''}"></span><div class="graph-mid"><button class="node ${mid?'done':started?'running':''}" data-action="node" data-node="implementation"><span class="pill ${mid?'green':started?'purple':''}">${mid?'Verified':started?'In progress':'Blocked'}</span><strong>Implementation</strong><small>Builder · behavior change</small></button><button class="node ${mid?'done':started?'running':''}" data-action="node" data-node="contract"><span class="pill ${mid?'green':started?'purple':''}">${mid?'Verified':started?'In progress':'Blocked'}</span><strong>Contract & edge tests</strong><small>Builder · independent fixture</small></button></div><span class="graph-edge split join ${mid?'flow':''}"></span><button class="node ${done&&t.qaFixed?'done':done?'running':''}" data-action="node" data-node="inspection"><span class="pill ${done&&t.qaFixed?'green':done?'orange':''}">${done?(t.qaFixed?'Verified':'Finding'):'Blocked'}</span><strong>Quality inspection</strong><small>Inspector · evidence review</small></button></div><div class="legend"><span><i style="background:var(--line)"></i>Waiting for dependency</span><span><i style="background:var(--violet)"></i>In progress</span><span><i style="background:var(--mint)"></i>Verified</span></div></div><div class="notice" style="margin-top:16px">Click a brick to inspect its acceptance criteria, dependencies, and evidence. The graph represents demo execution; it does not schedule real agents.</div>`}
function runBanner(t){if(t.status==='running'||t.status==='paused')return `<div class="order-summary"><svg class="progress-ring" viewBox="0 0 40 40" style="--offset:${100-t.progress}" aria-label="${t.progress}% complete"><circle cx="20" cy="20" r="16" pathLength="100"/><circle cx="20" cy="20" r="16" pathLength="100"/></svg><div class="grow"><strong class="small">${t.status==='paused'?'Crew is paused':t.autonomy==='guided'?'Ready for the next supervised step':'The pieces are coming together'}</strong><p class="help">${t.progress}% complete · ${money(t.spent)} simulated spend</p></div><div class="run-controls">${btn(t.status==='paused'?'Resume':'Pause',t.status==='paused'?'resume':'pause','small',t.status==='paused'?'play':'pause')}${t.status==='running'?btn('Next step','advance','small violet','chevron'):''}${t.status==='running'&&t.autonomy!=='guided'?btn(ui.auto?'Stop auto':'Auto-play','auto','small text',ui.auto?'pause':'play'):''}</div></div>`;if(t.status==='queued')return `<div class="callout orange"><strong>Waiting for a run slot</strong><p>Your ${state.settings.concurrency} run slots are occupied. Pause a run or increase the cap in Settings.</p>${btn('Retry scheduling','resume','small','play','style="margin-top:10px"')}</div>`;if(['draft','planning','clarification','ready'].includes(t.status))return `<div class="notice" style="margin-bottom:17px">The graph is a draft until the blueprint is reviewed and approved. <button data-action="tab" data-tab="plan" style="color:var(--violet)">Open blueprint</button></div>`;return t.status==='qa'?`<div class="callout orange"><strong>Inspector paused the handoff</strong><p>An acceptance check failed. Evidence and a targeted revision are waiting in Quality.</p>${btn('Inspect finding','tab','small','shield','data-tab="qa" style="margin-top:10px"')}</div>`:`<div class="notice" style="margin-bottom:17px">All execution steps are ${t.status==='complete'?'complete':'recorded'}. Open Quality to inspect the evidence.</div>`}
function activityView(t){return `${runBanner(t)}<div class="section-head"><h2>What’s happening</h2><span class="pill">Demo event stream</span></div><div class="timeline">${[...t.events].reverse().map(e=>`<article class="event">${bot(e.role,'compact')}<div class="event-body"><div class="row between"><strong class="small">${roles[e.role].name}</strong><time>${esc(e.time)}</time></div><p>${esc(e.text)}</p></div></article>`).join('')||'<div class="empty">The activity trail starts when you draft a blueprint.</div>'}</div>${t.progress>0?`<div class="terminal"><span class="muted"># Simulated sandbox output · ${project(t.project).repo}</span>\n<span class="good">✓</span> Checkout main → factory/${t.id.toLowerCase()}\n<span class="good">✓</span> ${t.progress>=30?'Baseline recorded: acceptance test fails before change':'Baseline test running'}\n${t.progress>=60?'<span class="good">✓</span> Implementation and contract tests assembled':'• Builder is implementing the reviewed contract'}\n${t.progress>=100?(t.qaFixed?'<span class="good">✓</span> All checks passed for demo revision '+(t.revision||1):'<span class="warn">!</span> Inspector found an uncovered edge case. Handoff paused.'):'• Inspection waits for dependencies'}</div>`:''}`}
function qaView(t){const finished=t.progress>=100;const p=project(t.project);return `<div class="section-head"><div><h2>Confidence comes with evidence</h2><p class="help" style="margin-top:5px">Checks and human judgment each have a job.</p></div>${btn('Quality contract','quality-contract','small text','shield',`data-id="${p.id}"`)}</div>${!finished?`<div class="notice" style="margin-bottom:20px">Evidence will appear as the crew executes the approved plan. Planned checks below are not completed results.</div>`:t.qaFixed?`<div class="callout green"><strong>Required checks passed in this simulation</strong><p>No unresolved Inspector findings for demo revision ${t.revision||1}. These are sample outcomes, not real test executions.</p></div>`:`<div class="callout orange"><div class="row">${bot('inspector','compact')}<strong>One contract edge is still open</strong></div><p>${t.project==='loan'?'Concurrent retries can race before the idempotency record is committed. The duplicate-write test fails.':t.project==='atlas'?'A stale response can overwrite a newer result. The out-of-order response check fails.':'Buffer capacity can be exceeded when two producers enqueue concurrently. The bounded-capacity check fails.'}</p><p><strong>Impact:</strong> ${t.project==='loan'?'A retry could write a duplicate ledger entry.':t.project==='atlas'?'Users could see results for an earlier search.':'Memory can grow beyond the configured bound.'}</p><div class="row wrap" style="margin-top:14px">${btn('Ask Builder to fix & recheck','fix-qa','primary','code')}${btn('Inspect regression evidence','evidence','small','external')}</div></div>`}<div class="evidence">${qualityCommands(p).map(([name,cmd],i)=>`<div class="qa-row ${finished&&!t.qaFixed&&i===0?'fail':''}">${icon(finished?(t.qaFixed||i!==0?'circlecheck':'alert'):'clock')}<div class="grow"><strong class="small">${name}</strong><p class="help mono">${cmd}</p></div><span class="pill ${finished?(t.qaFixed||i!==0?'green':'red'):''}">${finished?(t.qaFixed||i!==0?'Pass · demo':'Fail · demo'):'Planned'}</span></div>`).join('')}<div class="qa-row">${icon(finished&&t.qaFixed?'circlecheck':'clock')}<div class="grow"><strong class="small">Acceptance mapping & diff review</strong><p class="help">Inspector · scope, regressions, meaningful assertions</p></div><span class="pill ${finished&&t.qaFixed?'green':''}">${finished&&t.qaFixed?'Reviewed':'Pending'}</span></div><p class="help" style="margin-top:14px">Artifacts are tied to <span class="mono">demo-${t.id.toLowerCase()}-r${t.revision||1}</span>. Any implementation revision invalidates the previous approval.</p></div><div class="row wrap" style="margin-top:17px">${btn('View evidence bundle','evidence','','folder')}${finished&&t.qaFixed?btn('Continue to PR decision','tab','primary','arrow','data-tab="changes"'):''}</div>`}
function changesView(t){const ready=['review','complete','closed'].includes(t.status)&&t.qaFixed;const snippets=t.project==='loan'?{file:'internal/usecase/payment.go',old:'return ledger.Create(ctx, request)',next:['record, err := idempotency.Acquire(ctx, request.Key)','if err != nil { return resolveConflict(err) }','return ledger.CreateOnce(ctx, record, request)']}:t.project==='atlas'?{file:'src/composables/useProductSearch.ts',old:'results.value = await search(query)',next:['const requestId = ++latestRequest','const response = await search(query, { signal })','if (requestId === latestRequest) results.value = response']}: {file:'src/channel.rs',old:'buffer.push(message);',next:['let permit = capacity.try_acquire()?;','buffer.push(BufferedMessage::new(message, permit));']};return `${t.status==='complete'?`<div class="callout green"><strong>Assembled, reviewed, and approved.</strong><p>Your demo PR decision is recorded. No real pull request was created or merged.</p>${btn('View recorded decision','decision-record','small','book','style="margin-top:10px"')}</div>`:t.status==='closed'?`<div class="callout"><strong>Demo work order closed</strong><p>The proposed change was declined. The decision and evidence remain in this order.</p></div>`:ready?`<div class="callout green"><div class="row">${bot('inspector','compact')}<strong>The crew has done its part. Over to you.</strong></div><p>Demo PR #${t.id.replace('LF-','')} · 3 files changed · required evidence passed. Read the sample diff before deciding.</p><div class="row wrap" style="margin-top:14px">${btn('Approve demo PR','approve-pr','primary','check')}${btn('Request changes','request-changes','','message')}${btn('Decline','decline','small text')}</div></div>`:`<div class="notice" style="margin-bottom:18px">The PR decision unlocks after implementation and required quality checks pass. ${btn('View current stage','current-stage','small text','arrow')}</div>`}<div class="section-head"><h2>Sample change preview</h2><span class="pill">Illustrative diff</span></div><p class="help" style="margin-bottom:13px">This abbreviated example illustrates the intended behavior. It is not executable project code or an actual repository diff.</p><div class="file-diff"><header class="row between"><span>${snippets.file}</span><span><span style="color:var(--green)">+${snippets.next.length}</span> <span class="danger-text">−1</span></span></header><pre><span class="diff-del">− ${esc(snippets.old)}</span>${snippets.next.map(l=>`<span class="diff-add">+ ${esc(l)}</span>`).join('')}</pre></div><div class="plan-section" style="margin-top:20px"><h3>Reviewer’s checklist</h3><ul class="check-list">${['The behavior matches the approved acceptance contract.','Regression tests cover the original failure and edge cases.','No unrelated refactors or production mutations.','The final decision is attached to this specific demo revision.'].map(s=>`<li>${icon(ready?'circlecheck':'clock')}<span>${s}</span></li>`).join('')}</ul></div>${btn('Download review summary','export-review','','download')}`}
function settings(){const tabs=[['governance','Governance'],['preferences','My preferences'],['team','Team & access'],['integrations','Integrations'],['usage','Usage & resources']];return `<div class="page-heading"><div><div class="eyebrow">Make the factory work for your team</div><h1>Workspace settings</h1><p class="subtitle">Clear boundaries. Room to choose within them.</p></div><label class="select-label">Demo role <select id="demo-role" aria-label="Demo role"><option ${ui.role==='Admin'?'selected':''}>Admin</option><option ${ui.role==='Member'?'selected':''}>Member</option><option ${ui.role==='Viewer'?'selected':''}>Viewer</option></select></label></div><div class="settings-layout"><nav class="settings-nav" aria-label="Settings sections">${tabs.map(([id,label])=>`<button data-action="settings-tab" data-tab="${id}" class="${ui.settingsTab===id?'active':''}" ${ui.settingsTab===id?'aria-current="page"':''}>${label}</button>`).join('')}</nav><div>${ui.settingsTab==='governance'?governanceSettings():ui.settingsTab==='preferences'?preferenceSettings():ui.settingsTab==='team'?teamSettings():ui.settingsTab==='integrations'?integrationSettings():usageSettings()}</div></div>`}
function governanceSettings(){const s=state.settings;const disabled=ui.role!=='Admin'?'disabled':'';return `${ui.role!=='Admin'?'<div class="notice" style="margin-bottom:18px">Only workspace admins can change policy. Switch the demo role to Admin to explore editing.</div>':''}<form id="governance-form"><section class="settings-section"><h2>The people behind the policy</h2><p>Foreman and Architect defaults belong to the workspace. Members can choose preferences only from approved models.</p><div class="form-grid"><div class="model-card"><div class="agent-line">${bot('foreman','compact')}<div><strong>Foreman</strong><p>Orchestration & escalation</p></div></div><label class="help" for="policy-foreman">Foreman workspace model</label><select id="policy-foreman" name="foreman" ${disabled}>${optionModels(s.foreman)}</select></div><div class="model-card"><div class="agent-line">${bot('architect','compact')}<div><strong>Architect</strong><p>Planning & spec review</p></div></div><label class="help" for="policy-architect">Architect workspace model</label><select id="policy-architect" name="architect" ${disabled}>${optionModels(s.architect)}</select></div></div><div class="divider"></div><h3>Allowed provider & model catalog</h3><p class="help" style="margin:7px 0 14px">A demo catalog snapshot. Future OpenCode discovery and subscription authentication need separate product and provider validation.</p>${models.map(m=>`<label class="switch-row"><span><strong>${m.name}</strong><span class="help" style="display:block">${m.provider} · ${state.connections[m.connection]?'demo connection available':'demo connection disabled'}</span></span><span class="switch"><input type="checkbox" name="allowed" value="${m.id}" aria-label="Allow ${m.name}" ${s.allowed.includes(m.id)?'checked':''} ${disabled}><span></span></span></label>`).join('')}<p class="policy-status">${icon('lock')} Builder and Inspector choices inherit this allowed list.</p></section><section class="settings-section"><h2>Progressive autonomy</h2><p>Set the highest level available to work orders. New orders may choose a more supervised level.</p><div class="autonomy-levels">${['guided','assisted','delegated'].map((a,i)=>`<label class="level ${s.autonomy===a?'selected':''}"><input type="radio" name="autonomy" value="${a}" ${s.autonomy===a?'checked':''} ${disabled}><b>${i+1}. ${a[0].toUpperCase()+a.slice(1)}</b><p>${autonomyText(a)}</p></label>`).join('')}</div><div class="notice" style="margin-top:16px">All levels stop for unresolved contracts, exhausted budgets, missing evidence, and final PR decisions. More autonomy never removes verification requirements.</div></section><div id="settings-error" class="form-error" role="alert"></div>${btn('Save workspace policy','submit-governance','primary','check',disabled)}</form>`}
function preferenceSettings(){const s=state.settings;return `<form id="preferences-form"><section class="settings-section"><h2>Your crew preferences</h2><p>Workspace policy is the boundary. Your preferences apply to new work; task snapshots stay stable once execution starts.</p><div class="form-grid"><div class="form-group"><label for="pref-foreman">Preferred Foreman</label><select id="pref-foreman" name="prefForeman"><option value="default" ${s.prefForeman==='default'?'selected':''}>Workspace default · ${model(s.foreman).name}</option>${optionModels(s.prefForeman)}</select></div><div class="form-group"><label for="pref-architect">Preferred Architect</label><select id="pref-architect" name="prefArchitect"><option value="default" ${s.prefArchitect==='default'?'selected':''}>Workspace default · ${model(s.architect).name}</option>${optionModels(s.prefArchitect)}</select></div></div><div class="notice" style="margin-top:20px">Builder and Inspector are selected per work order, so you can balance implementation cost and independent review.</div></section>${btn('Save my preferences','save-preferences','primary','check')}</form><section class="settings-section" style="margin-top:22px"><h2>Appearance & demo data</h2><div class="switch-row"><div>Dark theme<p class="help">Saved on this browser.</p></div><label class="switch"><input type="checkbox" ${state.theme==='dark'?'checked':''} data-setting="theme" aria-label="Dark theme"><span></span></label></div><div class="switch-row"><div>Start fresh<p class="help">Restore sample work orders and local settings.</p></div>${btn('Reset demo','reset','small text','undo')}</div></section>`}
function teamSettings(){return `<section class="settings-section"><div class="row between"><div><h2 style="font-size:16px">A factory is a team effort</h2><p class="help" style="margin-top:7px">Demo memberships and per-user monthly limits.</p></div>${btn('Add demo member','invite','small','plus',ui.role!=='Admin'?'disabled':'')}</div>${state.members.map((m,i)=>`<div class="user-row"><span class="avatar" style="background:${['#F4D4B8','#D5D0F7','#CDE5DB'][i%3]}">${esc(m.name.split(' ').slice(0,2).map(s=>s[0]).join(''))}</span><div class="grow"><strong class="small">${esc(m.name)} ${i===0?'<span class="tiny muted">(you)</span>':''}</strong><p class="help">${esc(m.email)}</p><p class="help">${money(i===0?state.usage:m.spent)} used of ${money(i===0?state.settings.budget:m.budget)}</p></div>${i===0?'<span class="pill purple">Admin</span>':`<select aria-label="Role for ${esc(m.name)}" data-member-role="${i}" ${ui.role!=='Admin'?'disabled':''}>${['Admin','Member','Viewer'].map(r=>`<option ${m.role===r?'selected':''}>${r}</option>`).join('')}</select>`}<button class="btn small text" data-action="member-budget" data-id="${i}" aria-label="Edit budget for ${esc(m.name)}" ${ui.role!=='Admin'?'disabled':''}>${icon('settings')}</button></div>`).join('')}</section><div class="notice">Admin manages workspace policy, shared connections, and limits. Member creates and runs work. Viewer can inspect evidence. This role switch demonstrates frontend behavior only; backend authorization is not implemented.</div>`}
function integrationSettings(){return `<section class="settings-section"><h2>Connections, with clear ownership</h2><p>Shared connections serve the workspace. Personal connections serve only their owner. Every connection shown here is simulated.</p><div class="pill" style="margin-bottom:7px">Shared · managed by admins</div>${[['openai','OpenAI','O','Planning & review models'],['anthropic','Anthropic','A','Implementation & review models'],['github','GitHub','⌘','Demo repository and PR adapter']].map(([id,name,letter,hint])=>connectionRow(id,name,letter,hint,'shared')).join('')}</section><section class="settings-section"><div class="row between"><div><h2 style="font-size:16px">My connections</h2><p class="help" style="margin-top:6px">Private to Saifullah Panca · never exposed to other members.</p></div><span class="pill">Personal</span></div>${connectionRow('google','Google','G','Independent review model','personal')}${connectionRow('opencode','OpenCode','O','Future catalog / subscription auth exploration','personal')}</section><div class="notice">Connecting opens a demo consent preview. No credentials are collected, no OAuth is started, and no provider API is called. Subscription support is an unresolved integration decision.</div>`}
function connectionRow(id,name,letter,hint,scope){const on=state.connections[id];return `<div class="connection"><span class="provider-logo">${letter}</span><div class="grow"><h3>${name} <span class="pill ${on?'green':''}" style="font-size:9px;margin-left:5px">${on?'Simulated active':'Not enabled'}</span></h3><p>${hint}</p></div>${btn(on?'Manage':'Connect demo','connection','small','',`data-id="${id}" data-scope="${scope}" ${scope==='shared'&&ui.role!=='Admin'?'disabled':''}`)}</div>`}
function usageSettings(){const s=state.settings,disabled=ui.role!=='Admin'?'disabled':'';return `<section class="settings-section"><div class="row between"><div><h2 style="font-size:16px">Room to build. Limits that hold.</h2><p class="help" style="margin-top:5px">Saifullah’s illustrative monthly usage.</p></div><span class="pill purple">October 2026 · demo</span></div><div class="readout"><div><b>${money(state.usage)}</b><span>of ${money(s.budget)} monthly user limit</span></div><div><b>${activeCount()} / ${s.concurrency}</b><span>concurrent workspace runs</span></div></div><div class="budget-bars" aria-label="Illustrative daily spending: Sun 1.1, Mon 2.6, Tue 1.8, Wed 3.2, Thu 2.4, Fri 4.1, Sat 3.2 dollars">${[25,58,40,72,55,91,70].map((n,i)=>`<div class="budget-bar" style="height:${n}%"><span>${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</span></div>`).join('')}</div><p class="help" style="margin-top:31px">Provider prices and token accounting are placeholders. This demo stops additional build steps once your cap is reached.</p></section><form id="resources-form"><section class="settings-section"><h2>Budget & sandbox policy</h2><p>Admin controls the user cap and workspace capacity. Settings are simulated locally.</p><div class="form-grid"><div class="form-group"><label for="budget-cap">My monthly limit ($)</label><input id="budget-cap" name="budget" type="number" min="1" max="10000" step="1" required value="${s.budget}" ${disabled}></div><div class="form-group"><label for="concurrency-cap">Concurrent run slots</label><input id="concurrency-cap" name="concurrency" type="number" min="1" max="8" required value="${s.concurrency}" ${disabled}></div><div class="form-group"><label for="cpu-cap">vCPU per run</label><select id="cpu-cap" name="cpu" ${disabled}>${[2,4,8].map(x=>`<option value="${x}" ${s.cpu===x?'selected':''}>${x} vCPU</option>`).join('')}</select></div><div class="form-group"><label for="memory-cap">Memory per run</label><select id="memory-cap" name="memory" ${disabled}>${[4,8,16].map(x=>`<option value="${x}" ${s.memory===x?'selected':''}>${x} GB</option>`).join('')}</select></div></div><div class="notice" style="margin-top:18px">Reducing the concurrency limit pauses excess active demo runs. A budget below current usage pauses your active work until the limit is raised.</div></section>${btn('Save limits','save-resources','primary','check',disabled)}</form>`}
const memories=[{type:'Decision',title:'Why payment keys need a lifetime',body:'A human clarification became an explicit contract. Store the decision with its source, scope, and revision.',task:'LF-128',project:'loan'},{type:'Pattern',title:'Tests that explain the behavior',body:'Capture a reusable verification pattern only after evidence and human review. Keep language-specific context.',task:'LF-125',project:'atlas'},{type:'Change record',title:'A smaller diff, a clearer review',body:'An example record connecting intent, approved plan, implementation evidence, and final human decision.',task:'LF-121',project:'loan'}];
function catalog(){const enabled=state.settings.catalog;return `<div class="catalog-hero"><div><span class="pill purple">Cataloger · Future / experimental</span><h1>A factory that remembers why.</h1><p>A possible second brain for decisions, patterns, and change history—with sources you can trace. This is an optional concept preview, not agreed product scope.</p><label class="switch-row" style="border:0;padding-bottom:0;max-width:340px"><span class="small">Explore sample knowledge records</span><span class="switch"><input type="checkbox" id="catalog-toggle" ${enabled?'checked':''} aria-label="Explore sample knowledge records"><span></span></span></label></div><div class="catalog-illustration"><div class="floating-note">Decision + source</div>${bot('cataloger')}<div class="floating-note">A little context, kept.</div></div></div>${enabled?`<div class="toolbar"><div class="input-wrap" style="width:320px">${icon('search')}<input id="catalog-search" placeholder="Find a decision or pattern…" aria-label="Search sample knowledge" value="${esc(ui.catalogQuery)}"></div><span class="tiny muted">3 curated examples · no automatic ingestion</span></div><div class="catalog-grid" id="catalog-results">${catalogCards()}</div>`:`<div class="empty large"><h3>Keep the idea optional.</h3><p style="margin-top:8px">Turn on the preview to explore three sample records. No data is ingested.</p></div>`}<div class="notice" style="margin-top:23px"><strong>Questions still open:</strong> What deserves to be remembered? Who approves it? How do we handle stale knowledge, secrets, retention, and corrections? A future Cataloger should propose records with provenance, not silently promote every agent output into truth.</div>`}
function catalogCards(){const set=memories.filter(m=>(m.title+' '+m.body+' '+m.type).toLowerCase().includes(ui.catalogQuery.toLowerCase()));return set.map((m)=>`<button class="memory-card" data-action="memory" data-id="${memories.indexOf(m)}"><span class="pill purple">${m.type}</span><h3>${m.title}</h3><p>${m.body}</p><footer>${project(m.project).name} / ${m.task} · Source linked</footer></button>`).join('')||'<div class="empty">No matching sample records.</div>'}
function openModal(type,data={}){ui.lastFocus=document.activeElement;ui.modal={type,...data};renderModal();document.body.style.overflow='hidden';requestAnimationFrame(()=>{const f=$('#overlay input:not([type=radio]):not([type=checkbox]),#overlay textarea,#overlay select,#overlay button');f?.focus()})}
function closeModal(){ui.modal=null;$('#app').inert=false;$('#overlay').innerHTML='';document.body.style.overflow='';ui.lastFocus?.isConnected?ui.lastFocus.focus():$('#main')?.focus()}
function modalFrame(title,body,footer='',drawer=false,sub=''){return `<div class="modal-backdrop ${drawer?'drawer-backdrop':''}" data-backdrop="true"><section class="modal ${drawer?'drawer':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><header class="modal-head"><div class="row between"><div><h2 id="dialog-title">${title}</h2>${sub?`<p class="help" style="margin-top:6px">${sub}</p>`:''}</div><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${icon('close')}</button></div>${ui.modal?.type==='new'?`<div class="stepper" aria-label="Step ${ui.step} of 3"><span class="on"></span><span class="${ui.step>=2?'on':''}"></span><span class="${ui.step>=3?'on':''}"></span></div>`:''}</header><div class="modal-body">${body}</div>${footer?`<footer class="modal-footer">${footer}</footer>`:''}</section></div>`}
function renderModal(){if(!ui.modal)return;const m=ui.modal,t=task();let title='',body='',footer='',drawer=false,sub='';const cancel=btn('Cancel','close-modal');
if(m.type==='new'){title='Make something worthwhile.';sub=`New work order · Step ${ui.step} of 3`;drawer=true;const d=ui.draft;const p=project(d.project||'atlas');if(ui.step===1)body=`<form id="new-form" class="stack"><div class="form-group"><label for="new-title">What should the crew build?</label><input id="new-title" name="title" required maxlength="100" placeholder="e.g. Make payment retries idempotent" value="${esc(d.title||'')}"></div><div class="form-grid"><div class="form-group"><label for="new-project">Project</label><select id="new-project" name="project">${projects.map(p=>`<option value="${p.id}" ${(d.project||'atlas')===p.id?'selected':''}>${p.name}</option>`).join('')}</select></div><div class="form-group"><label for="new-repo">Repository</label><select id="new-repo" name="repo"><option value="${p.repo}">${p.repo}</option></select><span class="help">Demo repository · default branch main</span></div></div><div class="form-group"><label for="new-brief">Describe the outcome</label><textarea id="new-brief" name="brief" required maxlength="2500" placeholder="What problem should this solve? What should stay the same?">${esc(d.brief||'')}</textarea></div><div class="form-group"><label for="new-criteria">How will we know it works?</label><textarea id="new-criteria" name="criteria" required maxlength="1500" placeholder="Describe observable acceptance criteria…">${esc(d.criteria||'')}</textarea><span class="help">Specific behavior gives the crew a contract to verify.</span></div><div id="new-error" class="form-error" role="alert"></div></form>`;else if(ui.step===2)body=`<form id="new-form" class="stack"><div><h3>Choose the hands. Choose the eyes.</h3><p class="help" style="margin-top:6px">Task models can differ. Options come from workspace policy.</p></div><div class="form-grid">${['builder','inspector'].map(r=>`<div class="model-card"><div class="agent-line">${bot(r,'medium')}<div><strong>${roles[r].name}</strong><p>${roles[r].job}</p></div></div><label for="new-${r}" class="help">${r==='builder'?'Implementation model':'Independent review model'}</label><select id="new-${r}" name="${r}">${optionModels(d[r]||state.settings.allowed[r==='builder'?0:Math.min(1,state.settings.allowed.length-1)])}</select></div>`).join('')}</div><div class="notice"><div class="row" style="gap:8px">${icon('lock')}Governance is inherited</div><p style="margin-top:7px">Foreman: <strong>${model(resolveGov('foreman')).name}</strong><br>Architect: <strong>${model(resolveGov('architect')).name}</strong></p><p style="margin-top:7px">Admin defaults + your allowed preferences. These are snapshotted when this work order is created.</p></div><div class="form-group"><label for="new-autonomy">Autonomy for this order</label><select id="new-autonomy" name="autonomy">${allowedAutonomy().map(a=>`<option value="${a}" ${(d.autonomy||'guided')===a?'selected':''}>${a[0].toUpperCase()+a.slice(1)}</option>`).join('')}</select><span class="help">Maximum allowed: ${state.settings.autonomy}. PR decisions always stay human.</span></div><div class="form-error" id="new-error" role="alert"></div></form>`;else body=`<div class="stack"><div><span class="pill purple">${p.name}</span><h2 style="margin-top:13px">${esc(d.title)}</h2><p class="muted small" style="margin-top:9px;white-space:pre-wrap">${esc(d.brief)}</p></div><div class="notice"><strong>Acceptance contract</strong><p style="margin-top:7px;white-space:pre-wrap">${esc(d.criteria)}</p></div><div class="form-grid">${['builder','inspector'].map(r=>`<div class="agent-line">${bot(r,'compact')}<div><strong>${roles[r].name}</strong><p>${model(d[r]).name}</p></div></div>`).join('')}</div><div class="readout"><div><b>${money(estimate(d))}</b><span>illustrative estimate · not a quote</span></div><div><b style="font-size:17px;text-transform:capitalize">${d.autonomy}</b><span>autonomy · ${state.settings.cpu} vCPU / ${state.settings.memory} GB</span></div></div><div class="notice">Creating an order saves a draft. Foreman drafts a blueprint, Architect reviews it, and unresolved decisions return to you. No real agents or repositories are called.</div><div id="new-error" class="form-error" role="alert"></div></div>`;footer=`${ui.step===1?cancel:btn('Back','new-back','','back')}<span class="tiny muted">${ui.step} / 3</span>${btn(ui.step===3?'Create work order':'Continue',ui.step===3?'create-order':'new-next','primary',ui.step===3?'plus':'arrow')}`;}
else if(m.type==='clarify'){title='A small decision. A better blueprint.';body=`<div class="row" style="margin-bottom:20px">${bot('architect','medium')}<div><strong>Architect needs your input</strong><p class="help">${t.id} · recorded as a source decision</p></div></div><p class="small">${t.project==='loan'?'How long should an idempotency key remain valid?':'How long should the new behavior remain compatible with existing clients?'}</p><form id="clarify-form"><label class="radio-card"><input type="radio" name="answerChoice" value="${t.project==='loan'?'24-hour key lifetime; same payload returns the original result, conflicting payload returns 409.':'Support the current contract for one release, with an explicit deprecation warning.'}" checked><span><strong>${t.project==='loan'?'24-hour key lifetime':'One release of compatibility'}</strong><p>${t.project==='loan'?'Same key and payload replays the response. Different payload returns a conflict.':'Keep the existing behavior during migration.'}</p></span></label><label class="radio-card"><input type="radio" name="answerChoice" value="custom"><span><strong>A different contract</strong><p>Write the exact behavior the crew should preserve.</p></span></label><label class="form-label" for="clarify-answer">Decision or extra context</label><textarea id="clarify-answer" name="answer" placeholder="Add details, or enter your custom decision…" style="margin-top:8px"></textarea><div id="modal-error" class="form-error" role="alert"></div></form>`;footer=cancel+btn('Record decision & re-review','save-clarification','primary','check');}
else if(m.type==='persona'){const r=roles[m.id];title=r.name;body=`<div class="row" style="gap:23px;margin-bottom:24px">${bot(m.id)}<div><span class="pill purple">${r.job}</span><h3 style="margin-top:10px">${{foreman:'Keeps the whole factory moving.',architect:'A better blueprint before a single brick.',builder:'Turns a clear contract into working behavior.',inspector:'Trust the evidence. Question the gaps.',cataloger:'Keeps the why close to the what.'}[m.id]}</h3></div></div><p class="muted small" style="line-height:1.9">${{foreman:'Coordinates the workflow, resolves dependencies, watches limits, and escalates decisions. Deterministic gates control state transitions around agent judgments.',architect:'Reviews scope, acceptance criteria, task dependencies, and verification plans. Missing requirements become human clarifications, not hidden assumptions.',builder:'Implements in an isolated sandbox, starting with a failing behavioral check. Produces a scoped change and evidence tied to its revision.',inspector:'Reviews code and meaningful test assertions against the contract. A finding has an impact, evidence, and a resolution. Passing checks support judgment; they do not guarantee correctness.',cataloger:'An optional future role that could propose source-linked decisions, patterns, and change records for human curation. Scope, retention, permission, and correction policies remain open.'}[m.id]}</p><div class="notice" style="margin-top:20px">Original brick-inspired character design. No trademark logos. All agent behavior in this prototype is simulated.</div>`;footer=btn('Got it','close-modal','primary');}
else if(m.type==='node'){const nodes={baseline:['Failing baseline','None','Reproduce the requested behavior against the unchanged baseline. The test must fail for the expected reason.','Baseline log + assertion trace'],implementation:['Implementation','Failing baseline','Implement the smallest scoped behavior change. Keep public contracts and repository conventions.','Scoped diff + build log'],contract:['Contract & edge tests','Failing baseline','Cover concurrency, retries, invalid inputs, and compatibility where they apply. Use assertions on observable behavior.','Regression checks + acceptance mapping'],inspection:['Quality inspection','Implementation + contract tests','Review the actual diff and test assertions. Validate required checks on the same revision and surface unresolved findings.','Check outputs + Inspector findings + revision identity']};const n=nodes[m.node];title=n[0];body=`<span class="pill">Task in ${t.id}</span><p class="muted small" style="margin-top:18px;line-height:1.9">${n[2]}</p><div class="readout"><div><span>Depends on</span><strong style="display:block;font-size:12px;margin-top:7px">${n[1]}</strong></div><div><span>Evidence expected</span><strong style="display:block;font-size:12px;margin-top:7px">${n[3]}</strong></div></div><div class="notice">${t.progress>=100?'Demo artifacts have been recorded. Open Quality to inspect the current result.':'This node waits for its dependencies and the approved blueprint.'}</div>`;footer=btn('Close','close-modal')+btn('Open evidence','node-evidence','primary','folder');}
else if(m.type==='evidence'){title='Evidence you can trace';body=`<span class="pill purple">Sample evidence bundle</span><p class="muted small" style="margin:15px 0">${t.id} / demo revision ${t.revision||1} · ${t.progress>=100?'recorded in this simulation':'planned, execution incomplete'}</p><div class="terminal" style="margin-top:0">artifact: demo-${t.id.toLowerCase()}-r${t.revision||1}\nsource: ${project(t.project).repo}\nbaseline: ${t.progress>=30?'expected failure observed (simulated)':'pending'}\ncontract_tests: ${t.progress>=100?(t.qaFixed?'pass (simulated)':'1 regression failure (simulated)'):'pending'}\nstatic_checks: ${t.progress>=100?'pass (simulated)':'pending'}\ninspector: ${t.progress>=100&&t.qaFixed?'no unresolved findings (simulated)':'pending / unresolved'}\nhuman_decision: ${t.status==='complete'?'approved demo PR':t.status==='closed'?'declined demo PR':'pending'}</div><div class="notice" style="margin-top:18px">No real test process was executed. In the product, immutable artifact IDs, exact source revision, command output, exit status, and reviewer identity would be required before these claims are trusted.</div>`;footer=btn('Close','close-modal')+btn('Download summary','export-review','primary','download');}
else if(m.type==='quality-contract'){const p=project(m.id);title='A contract for quality';body=`<span class="pill purple">${p.name} · ${p.lang}</span><p class="muted small" style="margin:17px 0">Repository profiles define observable gates. Agent style instructions support these gates; they cannot replace evidence.</p>${qualityCommands(p).map(([n,c])=>`<div class="qa-row">${icon('shield')}<div><strong class="small">${n}</strong><p class="help mono">${c}</p></div></div>`).join('')}<ul class="check-list">${['Acceptance criteria mapped to behavioral tests.','Failing baseline before implementation; passing final revision.','Language-specific checks and meaningful assertions.','Inspector review of scope, regression risk, and test quality.','Human PR decision after unresolved findings are closed.'].map(s=>`<li>${icon('circlecheck')}<span>${s}</span></li>`).join('')}</ul><div class="notice">These commands are illustrative. Production onboarding must discover or confirm a repository’s actual supported checks.</div>`;footer=btn('Understood','close-modal','primary');}
else if(m.type==='revision'){title=m.kind==='plan'?'Refine the blueprint':'Request a focused revision';body=`<form id="revision-form"><div class="form-group"><label for="revision-text">What needs to change, and why?</label><textarea id="revision-text" required maxlength="1500" placeholder="Describe the gap and the expected behavior…"></textarea><p class="help">Your note stays in the activity trail. ${m.kind==='plan'?'Architect will review the revised blueprint.':'A new implementation revision invalidates previous quality approval.'}</p></div><div id="modal-error" class="form-error" role="alert"></div></form>`;footer=cancel+btn('Send revision to crew','save-revision','primary','message');}
else if(m.type==='approve'){title='Your decision closes the loop';body=`<div class="row">${bot('inspector','medium')}<div><strong>${esc(t.title)}</strong><p class="help">${t.id} · demo revision ${t.revision||1}</p></div></div><ul class="check-list" style="margin:22px 0"><li>${icon('circlecheck')}Required demo checks passed.</li><li>${icon('circlecheck')}No unresolved Inspector findings.</li><li>${icon('circlecheck')}Decision attached to the current revision.</li></ul><label class="form-label" for="decision-note">Decision note (optional)</label><textarea id="decision-note" placeholder="Record your reasoning…" style="margin-top:8px"></textarea><div class="notice" style="margin-top:15px">This records a demo approval and marks the order assembled. It does not create, publish, or merge a real pull request.</div>`;footer=cancel+btn('Record demo approval','confirm-pr','primary','check');}
else if(m.type==='decline'){title='Close this proposed change?';body=`<p class="muted small">The order will be marked closed, with its demo evidence retained.</p><div class="form-group" style="margin-top:17px"><label for="decline-reason">Reason for declining</label><textarea id="decline-reason" required placeholder="Explain why this change should not proceed…"></textarea></div><div id="modal-error" class="form-error" role="alert"></div>`;footer=cancel+btn('Decline demo PR','confirm-decline','primary');}
else if(m.type==='decision-record'){title='Recorded human decision';body=`<span class="pill green">${t.status==='complete'?'Approved':'Declined'} · demo</span><h3 style="margin:18px 0 8px">${esc(t.title)}</h3><p class="muted small">${esc(t.decisionNote||'Acceptance evidence and sample change reviewed. Approved in the prototype.')}</p><div class="notice" style="margin-top:18px">Saifullah Panca · ${t.id} · demo revision ${t.revision||1}. No external PR action occurred.</div>`;footer=btn('Close','close-modal','primary');}
else if(m.type==='task-models'){title='The crew for this order';const editable=['draft','planning','clarification','ready'].includes(t.status);body=`<p class="muted small" style="margin-bottom:19px">${editable?'Choose task-specific models from the workspace allowed catalog.':'Execution has started. These model assignments are fixed for this demo run.'}</p><form id="task-model-form" class="stack">${['builder','inspector'].map(r=>`<div class="form-group"><label for="task-${r}" class="row">${bot(r,'compact')}${roles[r].name}</label><select id="task-${r}" name="${r}" ${!editable?'disabled':''}>${optionModels(t[r])}</select></div>`).join('')}<div class="form-group"><label for="task-autonomy">Autonomy for this order</label><select id="task-autonomy" name="autonomy" ${!editable&&t.status!=='paused'&&t.status!=='queued'?'disabled':''}>${allowedAutonomy().map(a=>`<option value="${a}" ${t.autonomy===a?'selected':''}>${a[0].toUpperCase()+a.slice(1)}</option>`).join('')}</select><p class="help">You can lower autonomy to meet a stricter workspace policy, including on a paused run.</p></div><div id="modal-error" class="form-error" role="alert"></div></form><div class="notice" style="margin-top:18px">Foreman and Architect are snapshotted from workspace defaults plus allowed user preferences. New policy restrictions still gate execution.</div>`;footer=btn('Close','close-modal')+(editable||['paused','queued'].includes(t.status)?btn('Save task configuration','save-task-models','primary','check'):'');}

function searchResults(q){q=q.toLowerCase();const ts=state.tasks.filter(t=>(t.title+' '+t.id+' '+project(t.project).name).toLowerCase().includes(q));const ps=projects.filter(p=>(p.name+' '+p.repo).toLowerCase().includes(q));return ps.map(p=>`<button class="search-result" data-action="search-project" data-id="${p.id}"><span class="row">${icon('folder')}<strong>${p.name}</strong></span><small>Project · ${p.repo}</small></button>`).join('')+ts.map(t=>`<button class="search-result" data-action="search-open" data-id="${t.id}"><strong>${esc(t.title)}</strong><small>${t.id} · ${project(t.project).name} · ${statuses[t.status][0]}</small></button>`).join('')||'<div class="empty">No matching projects or work orders.</div>'}
function resolveGov(r){const v=state.settings['pref'+r[0].toUpperCase()+r.slice(1)];return v==='default'?state.settings[r]:v}
function allowedAutonomy(){const a=['guided','assisted','delegated'];return a.slice(0,a.indexOf(state.settings.autonomy)+1)}
function snapshot(){return {foreman:resolveGov('foreman'),architect:resolveGov('architect')}}
function estimate(d){return Number((2.1+(d.builder==='gpt'?.7:.3)+(d.inspector==='gpt'?.6:.2)+(d.criteria?.length||0)/1000).toFixed(2))}
function canWrite(){if(ui.role==='Viewer'){toast('Viewer can inspect work. Switch the demo role in Settings to create or run it.');return false}return true}
function gate(t){const allowed=state.settings.allowed;for(const r of ['builder','inspector','foreman','architect']){const id=['builder','inspector'].includes(r)?t[r]:(t.gov||snapshot())[r];if(!allowed.includes(id))return `${roles[r].name} model is no longer allowed by workspace policy.`;if(!state.connections[model(id).connection])return `${model(id).provider} demo connection is disabled. Enable it in Settings.`}if(!state.connections.github)return 'The shared GitHub demo connection is disabled.';if(!allowedAutonomy().includes(t.autonomy))return 'This order exceeds the workspace autonomy policy. Lower its level before starting.';if(state.usage>=state.settings.budget)return 'Monthly demo budget reached. Raise the user limit in Settings to continue.';return ''}
function stopAuto(){ui.auto=false;clearInterval(ui.simTimer);ui.simTimer=null}
function setAuto(){if(ui.auto){stopAuto();render();return}const t=task();if(!t||t.status!=='running')return;ui.auto=true;ui.simTimer=setInterval(()=>{if(document.hidden||ui.modal)return;const t=task();if(!t||t.status!=='running'){stopAuto();return}advance(t);},2500);render()}
function start(t){if(!canWrite())return;const reason=gate(t);if(reason){toast(reason);return}t.gov=t.gov||snapshot();if(activeCount()>=state.settings.concurrency&&t.status!=='running'){t.status='queued';addEvent(t,'foreman','Approved plan queued: waiting for workspace capacity.');save();ui.tab='graph';render();toast('Plan approved. Order queued until a run slot is available.');return}t.status='running';if(!t.progress)t.progress=10;addEvent(t,'foreman',`${t.autonomy==='delegated'?'Workspace policy authorized the Architect-reviewed blueprint.':'Blueprint approved by Saifullah.'} ${t.autonomy} execution started in the demo sandbox.`);save();ui.tab='graph';render();toast(t.autonomy==='guided'?'Plan approved. Advance each supervised build step.':'Plan approved. Use Next step or Auto-play to simulate the run.')}
function advance(t){if(t.status!=='running'||!canWrite())return;const reason=gate(t);if(reason){t.status='paused';stopAuto();addEvent(t,'foreman',reason);save();render();toast(reason);return}if(t.autonomy==='guided'&&ui.auto){stopAuto();render();return}const delta=t.progress<30?25:t.progress<65?35:100-t.progress;const cost=Math.min(.48,state.settings.budget-state.usage);state.usage=Number((state.usage+cost).toFixed(2));t.spent=Number((t.spent+cost).toFixed(2));t.progress=Math.min(100,t.progress+delta);if(t.progress<60)addEvent(t,'builder','Recorded a failing baseline for the acceptance contract. Starting the scoped implementation.');else if(t.progress<100)addEvent(t,'builder','Implementation and independent contract tests are ready. Required sandbox checks are running.');else{t.status='qa';t.qaFixed=false;addEvent(t,'inspector','Regression evidence exposed an edge case. Handoff stopped; a focused revision is required.');stopAuto();ui.tab='qa';toast('Inspector found a contract edge. Open the evidence and ask Builder for a fix.')}save();render()}
function enforceLimits(){let active=state.tasks.filter(t=>t.status==='running');active.forEach((t,i)=>{const reason=gate(t);if(reason||i>=state.settings.concurrency){t.status='paused';addEvent(t,'foreman',reason||'Paused because workspace concurrency was reduced.')}});if(task()?.status!=='running')stopAuto()}
function download(name,text,type='text/markdown'){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Downloaded '+name)}
function planMarkdown(t){return `# ${t.id}: ${t.title}\n\n> legos-factory demo. No real provider or repository execution.\n\nProject: ${project(t.project).name}\nRepository: ${project(t.project).repo}\n\n## Outcome\n${t.brief}\n\n## Acceptance contract\n${t.criteria}\n\n## Human decision\n${t.answer||'No clarification recorded yet.'}\n\n## Crew\nForeman: ${model((t.gov||snapshot()).foreman).name}\nArchitect: ${model((t.gov||snapshot()).architect).name}\nBuilder: ${model(t.builder).name}\nInspector: ${model(t.inspector).name}\nAutonomy: ${t.autonomy}\n\n## Task graph\nFailing baseline -> [implementation, contract tests] -> Inspector review -> human PR decision.\n\n## Quality gates\n${qualityCommands(project(t.project)).map(([n,c])=>'- '+n+': `'+c+'`').join('\n')}\n- Meaningful assertions, acceptance mapping, and scoped diff review.\n\n## Scope boundaries\nNo adjacent refactors or production mutations. New ambiguity returns to the human.\n`}
function reviewMarkdown(t){return `# Demo review summary: ${t.id}\n\n${t.title}\n\nState: ${statuses[t.status][0]}\nDemo revision: ${t.revision||1}\nProgress: ${t.progress}%\nSimulated spend: ${money(t.spent)}\nRequired checks: ${t.progress>=100?(t.qaFixed?'passed (simulated)':'unresolved regression (simulated)'):'not complete'}\nHuman decision: ${t.decisionNote||'pending'}\n\nAll test results and changes are illustrative. No real test execution or PR action occurred.\n\n## Activity\n${t.events.map(e=>'- '+e.time+' / '+roles[e.role].name+': '+e.text).join('\n')}\n`}
function updateWork(){const old=$('#work-results');if(old)old.innerHTML=workResults();if($('#result-count'))$('#result-count').textContent=filteredTasks().length+' work orders'}
function navigate(page){stopAuto();ui.page=page;ui.task=null;ui.menu=false;render();window.scrollTo(0,0)}
function openTask(id){stopAuto();ui.task=id;ui.page='factory';ui.menu=false;const t=task();ui.tab=t?.status==='review'||t?.status==='complete'||t?.status==='closed'?'changes':t?.status==='qa'?'qa':t?.status==='running'||t?.status==='paused'||t?.status==='queued'?'graph':'plan';render();window.scrollTo(0,0)}

case 'toggle-connection':{if(ui.modal.scope==='shared'&&ui.role!=='Admin')break;const id=ui.modal.id;state.connections[id]=!state.connections[id];enforceLimits();save();closeModal();render();toast('Demo connection '+(state.connections[id]?'enabled. No real connection was made.':'disabled. Affected runs are paused.'));break}
case 'invite':if(ui.role==='Admin')openModal('invite');break;
case 'save-invite':{if(ui.role!=='Admin')break;const f=$('#invite-form');if(!f.reportValidity())break;const name=$('#member-name').value.trim(),email=$('#member-email').value.trim();if(!name||state.members.some(m=>m.email.toLowerCase()===email.toLowerCase())){error('#modal-error',name?'A demo member already uses that email.':'Enter a display name.');break}state.members.push({name,email,role:$('#member-role').value,budget:25,spent:0});save();closeModal();render();toast('Demo member added locally. No email was sent.');break}
case 'member-budget':if(ui.role==='Admin')openModal('member-budget',{id:Number(id)});break;
case 'save-member-budget':{if(ui.role!=='Admin')break;const field=$('#member-cap');if(!field.reportValidity())break;const n=Number(field.value);if(!Number.isFinite(n)||n<1||n>10000){error('#modal-error','Use a budget from $1 to $10,000.');break}state.members[ui.modal.id].budget=n;if(ui.modal.id===0){state.settings.budget=n;enforceLimits()}save();closeModal();render();toast('User limit saved.');break}
case 'reset':openModal('reset');break;
case 'confirm-reset':stopAuto();state=initial();save();ui.query='';ui.filter='all';ui.project='all';closeModal();navigate('overview');toast('The original demo is ready to explore.');break;
case 'search':openModal('search');break;
case 'notifications':openModal('notifications');break;
case 'workspace':openModal('workspace');break;
case 'workspace-settings':closeModal();ui.settingsTab='team';navigate('settings');break;
case 'memory':openModal('memory',{id:Number(id)});break;
}});
document.addEventListener('input',e=>{if(e.target.id==='work-search'){ui.query=e.target.value;updateWork()}if(e.target.id==='global-search')$('#search-results').innerHTML=searchResults(e.target.value);if(e.target.id==='catalog-search'){ui.catalogQuery=e.target.value;$('#catalog-results').innerHTML=catalogCards()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='status-filter'){ui.filter=el.value;updateWork()}if(el.id==='new-project'){ui.draft.project=el.value;const p=project(el.value);$('#new-repo').innerHTML=`<option value="${p.repo}">${p.repo}</option>`}if(el.id==='catalog-toggle'){state.settings.catalog=el.checked;save();render()}if(el.dataset.setting==='theme'){state.theme=el.checked?'dark':'light';save();render()}if(el.id==='demo-role'){ui.role=el.value;render();toast('Previewing '+ui.role+' permissions.')}if(el.dataset.memberRole!==undefined&&ui.role==='Admin'){state.members[Number(el.dataset.memberRole)].role=el.value;save();toast('Demo membership role saved.')}if(el.name==='autonomy'&&$('#governance-form')){$$('.level').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked))}});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search')}if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.menu){ui.menu=false;render()}}if(e.key==='Tab'&&ui.modal){const focus=$$('#overlay button:not(:disabled),#overlay input:not(:disabled),#overlay select:not(:disabled),#overlay textarea:not(:disabled),#overlay a[href]').filter(x=>x.offsetParent!==null);const first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
state.tasks.forEach(t=>{t.gov=t.gov||snapshot()});
render();
</script>
</body>
