<title>Legos prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap">
<style>
:root,[data-theme="light"]{--emerald-950:#051f20;--emerald-900:#0b2b26;--emerald-800:#163832;--emerald-700:#235347;--emerald-300:#8eb69b;--emerald-100:#daf1de;--canvas:#f2f6f3;--surface:#ffffff;--surface-2:#e9f0eb;--line:#d7e2da;--line-strong:#7f9a8b;--ink:#051f20;--muted:#4a6660;--brand:#163832;--brand-hover:#0b2b26;--on-brand:#daf1de;--accent:#235347;--tint:#daf1de;--chart-1:#163832;--chart-2:#8eb69b;--chart-3:#c9dccf;--success:#1d6e4a;--success-soft:#dcf1e4;--warning:#8a4f0c;--warning-soft:#fbecd6;--danger:#a83446;--danger-soft:#f9e1e4;--info:#2a627b;--info-soft:#dcecf3;--crew-foreman:#f2aa6b;--crew-architect:#a89cec;--crew-builder:#8bbcc9;--crew-inspector:#a0cfb7;--crew-cataloger:#d7a8c5;--shadow-card:0 1px 2px rgba(5,31,32,0.04), 0 8px 24px rgba(5,31,32,0.05);--shadow-pop:0 16px 48px rgba(5,31,32,0.14);--shadow-focus:0 0 0 3px rgba(35,83,71,0.28)}
[data-theme="dark"]{--canvas:#051f20;--surface:#0b2b26;--surface-2:#163832;--line:#235347;--line-strong:#5d8a76;--ink:#daf1de;--muted:#9cc2a8;--brand:#8eb69b;--brand-hover:#a9cdb4;--on-brand:#051f20;--accent:#b9dcc3;--tint:#1d4a40;--chart-1:#daf1de;--chart-2:#8eb69b;--chart-3:#235347;--success:#86d8ab;--success-soft:#133d2e;--warning:#f2b56b;--warning-soft:#3b2e17;--danger:#ff9eab;--danger-soft:#3f1d24;--info:#93cbe3;--info-soft:#12324a;--shadow-card:0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.25);--shadow-pop:0 16px 48px rgba(0,0,0,0.5);--shadow-focus:0 0 0 3px rgba(185,220,195,0.35)}
:root{--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--radius-xs:6px;--radius-sm:9px;--radius-md:10px;--radius-lg:14px;--radius-xl:18px;--radius-2xl:24px;--radius-full:999px;--rail-width:216px;--thread-width:760px;--control-height:39px;--control-height-sm:33px;--font-display:Outfit, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;--font-sans:-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;--font-mono:ui-monospace, SFMono-Regular, Consolas, monospace}

/* Legos components: class-based, framework-free. Tokens come from tokens.css. */
:root {
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 140ms;
  --dur: 240ms;
  --dur-slow: 420ms;
}
.lg, .lg * { box-sizing: border-box; }
.lg { font: 14px/1.5 var(--font-sans); color: var(--ink); -webkit-font-smoothing: antialiased; }
.lg button { font: inherit; color: inherit; cursor: pointer; }
.lg :focus-visible { outline: none; box-shadow: var(--shadow-focus); }
.lg-display { font-family: var(--font-display); }

/* Button */
.lg-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: var(--control-height); padding: 9px 15px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); border-radius: var(--radius-md); font-weight: 550; white-space: nowrap; transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast), box-shadow var(--dur-fast), border-color var(--dur-fast); }
.lg-btn:hover { background: var(--surface-2); transform: translateY(-1px); }
.lg-btn:active { transform: translateY(0) scale(0.97); }
.lg-btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.lg-btn.primary:hover { background: var(--brand-hover); box-shadow: 0 6px 16px rgba(5, 31, 32, 0.18); }
.lg-btn.ghost { background: transparent; border-color: transparent; }
.lg-btn.ghost:hover { background: var(--surface-2); }
.lg-btn.danger { color: var(--danger); }
.lg-btn.pill { border-radius: var(--radius-full); }
.lg-btn.small { min-height: var(--control-height-sm); padding: 6px 11px; font-size: 12px; }
.lg-btn[disabled] { opacity: 0.45; pointer-events: none; }
.lg-btn .lg-spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: lg-spin 0.7s linear infinite; }
.lg-icon-btn { position: relative; width: 37px; height: 37px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); transition: background var(--dur-fast), transform var(--dur-fast) var(--ease-out); }
.lg-icon-btn:hover { background: var(--surface-2); }
.lg-icon-btn:active { transform: scale(0.92); }
.lg-icon-btn.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.lg-icon-btn .badge { position: absolute; top: 6px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--crew-foreman); border: 2px solid var(--surface); animation: lg-pop var(--dur) var(--ease-spring); }
.lg-ico { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Pill nav (segmented) with sliding thumb */
.lg-seg { position: relative; display: inline-flex; padding: 4px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-full); }
.lg-seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: var(--radius-full); background: var(--brand); transition: transform var(--dur) var(--ease-out), width var(--dur) var(--ease-out); }
.lg-seg button { position: relative; z-index: 1; border: 0; background: none; padding: 7px 16px; border-radius: var(--radius-full); font-size: 12px; font-weight: 550; color: var(--muted); transition: color var(--dur); }
.lg-seg button:hover { color: var(--ink); }
.lg-seg button.active { color: var(--on-brand); }

/* Rail nav */
.lg-nav { display: grid; gap: 2px; }
.lg-nav-label { font-size: 11px; font-weight: 600; color: var(--muted); margin: var(--space-5) var(--space-3) var(--space-2); }
.lg-nav a { display: flex; align-items: center; gap: var(--space-3); padding: 9px var(--space-3); border-radius: var(--radius-md); color: var(--muted); font-weight: 550; text-decoration: none; cursor: pointer; transition: background var(--dur-fast), color var(--dur-fast); }
.lg-nav a:hover { background: var(--surface-2); color: var(--ink); }
.lg-nav a.active { background: var(--tint); color: var(--accent); }
.lg-nav .count { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--surface); color: var(--muted); padding: 1px 7px; border-radius: var(--radius-xs); }

/* Pill / status */
.lg-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; line-height: 16px; border-radius: var(--radius-xs); padding: 4px 8px; background: var(--surface-2); color: var(--muted); white-space: nowrap; transition: background var(--dur), color var(--dur); }
.lg-pill.success { background: var(--success-soft); color: var(--success); }
.lg-pill.warning { background: var(--warning-soft); color: var(--warning); }
.lg-pill.danger { background: var(--danger-soft); color: var(--danger); }
.lg-pill.info { background: var(--info-soft); color: var(--info); }
.lg-pill.brand { background: var(--tint); color: var(--accent); }
.lg-pill.round { border-radius: var(--radius-full); }
.lg-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; display: inline-block; flex-shrink: 0; }
.lg-dot.live { animation: lg-pulse 1.6s ease-in-out infinite; }

/* Progress */
.lg-progress { height: 6px; background: var(--chart-3); border-radius: var(--radius-full); overflow: hidden; }
.lg-progress > i { display: block; height: 100%; width: 0; background: var(--chart-1); border-radius: inherit; transition: width var(--dur-slow) var(--ease-out); }
.lg-progress.live > i { background-image: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.35) 50%, transparent 100%); background-size: 200% 100%; background-color: var(--chart-1); animation: lg-shimmer 1.4s linear infinite; }
.lg-segments { display: flex; gap: 4px; }
.lg-segments i { flex: 1; height: 8px; border-radius: 2px; background: var(--chart-3); transition: background var(--dur) var(--ease-out); }
.lg-segments i.on { background: var(--chart-1); }

/* Card / panel */
.lg-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-5); }
.lg-card-head { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-4); }
.lg-card-head h3 { margin: 0; font-size: 15px; line-height: 22px; font-weight: 650; }
.lg-card-head .lg-count { font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); border-radius: var(--radius-xs); padding: 1px 7px; }
.lg-card-head .end { margin-left: auto; }
.lg-stat { display: grid; gap: var(--space-2); }
.lg-stat .label { display: flex; align-items: center; gap: var(--space-2); color: var(--muted); font-size: 12px; }
.lg-stat .label .lg-ico { width: 28px; height: 28px; padding: 5px; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.lg-stat .value { font: 500 32px/36px var(--font-display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.lg-stat .note { font-size: 12px; color: var(--muted); }
.lg-delta { font-size: 11px; font-weight: 600; color: var(--success); }

/* Rows */
.lg-rows { display: grid; }
.lg-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-top: 1px solid var(--line); transition: opacity var(--dur), transform var(--dur) var(--ease-out), max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow); max-height: 80px; overflow: hidden; }
.lg-row:first-child { border-top: 0; }
.lg-row .title { font-weight: 550; }
.lg-row .meta { font-size: 12px; color: var(--muted); }
.lg-row.leaving { opacity: 0; transform: translateX(16px); max-height: 0; padding: 0; }
.lg-file-ico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--tint); color: var(--accent); flex-shrink: 0; }

/* Avatar + crew */
.lg-avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 650; background: var(--tint); color: var(--accent); flex-shrink: 0; overflow: hidden; }
.lg-avatar img { width: 100%; height: 118%; object-fit: cover; object-position: top; }
.lg-avatar.foreman { background: var(--crew-foreman); } .lg-avatar.architect { background: var(--crew-architect); } .lg-avatar.builder { background: var(--crew-builder); } .lg-avatar.inspector { background: var(--crew-inspector); } .lg-avatar.cataloger { background: var(--crew-cataloger); }
.lg-agent { display: grid; justify-items: start; gap: var(--space-2); padding: var(--space-3); border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface-2); cursor: pointer; transition: transform var(--dur) var(--ease-out), border-color var(--dur); }
.lg-agent:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.lg-agent img { width: 36px; height: 45px; transition: transform var(--dur) var(--ease-spring); }
.lg-agent.working img { animation: lg-bob 1.8s ease-in-out infinite; }

/* Inputs */
.lg-field { width: 100%; min-height: 40px; padding: 10px 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font: inherit; transition: border-color var(--dur-fast), box-shadow var(--dur-fast); }
.lg-field::placeholder { color: var(--muted); }
.lg-field:focus { outline: none; border-color: var(--accent); box-shadow: var(--shadow-focus); }
.lg-search { position: relative; display: flex; align-items: center; }
.lg-search .lg-ico { position: absolute; left: 12px; width: 16px; color: var(--muted); }
.lg-search .lg-field { padding-left: 36px; border-radius: var(--radius-full); background: var(--surface-2); border-color: transparent; }
.lg-search kbd { position: absolute; right: 10px; font: 11px var(--font-mono); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }

/* ===== Chat ===== */
.lg-thread { display: grid; gap: var(--space-4); max-width: var(--thread-width); margin: 0 auto; }
.lg-msg { display: flex; gap: var(--space-3); align-items: flex-start; animation: lg-rise var(--dur-slow) var(--ease-out) both; }
.lg-msg.user { justify-content: flex-end; }
.lg-msg .bubble { max-width: 78%; padding: 10px 14px; border-radius: var(--radius-2xl); line-height: 21px; }
.lg-msg.user .bubble { background: var(--brand); color: var(--on-brand); border-bottom-right-radius: var(--radius-xs); }
.lg-msg.assistant .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: var(--radius-xs); }
.lg-msg .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
.lg-msg .who b { color: var(--ink); font-weight: 600; }
.lg-msg code { font: 12px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.lg-caret::after { content: ""; display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px; background: var(--accent); border-radius: 1px; animation: lg-blink 0.9s steps(1) infinite; }
.lg-typing { display: inline-flex; gap: 4px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-2xl); border-top-left-radius: var(--radius-xs); }
.lg-typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: lg-typing 1.2s ease-in-out infinite; }
.lg-typing i:nth-child(2) { animation-delay: 0.15s; } .lg-typing i:nth-child(3) { animation-delay: 0.3s; }

.lg-step { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--surface); overflow: hidden; animation: lg-rise var(--dur) var(--ease-out) both; }
.lg-step > summary, .lg-step .head { list-style: none; display: flex; align-items: center; gap: var(--space-2); padding: 9px 12px; font-size: 12px; cursor: pointer; }
.lg-step > summary::-webkit-details-marker { display: none; }
.lg-step .state { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
.lg-step.running .state { border: 2px solid var(--info); border-right-color: transparent; animation: lg-spin 0.8s linear infinite; }
.lg-step.done .state { background: var(--success); color: var(--surface); animation: lg-pop var(--dur) var(--ease-spring); }
.lg-step.done .state::after { content: ""; width: 6px; height: 3px; border: 1.8px solid currentColor; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.lg-step .name { font-weight: 600; } .lg-step .arg { font-family: var(--font-mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-step .time { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.lg-step .chev { transition: transform var(--dur) var(--ease-out); color: var(--muted); }
.lg-step[open] .chev { transform: rotate(90deg); }
.lg-step .body { padding: 10px 12px; border-top: 1px solid var(--line); background: var(--surface-2); font: 12px/18px var(--font-mono); color: var(--muted); white-space: pre-wrap; }
.lg-step.running { background-image: linear-gradient(90deg, transparent, var(--tint), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: lg-sweep 1.6s linear infinite, lg-rise var(--dur) var(--ease-out) both; }

.lg-gate { border: 1px solid var(--line); border-radius: var(--radius-lg); background: var(--warning-soft); padding: var(--space-4); display: grid; gap: var(--space-3); animation: lg-rise var(--dur-slow) var(--ease-out) both; transition: background var(--dur-slow); }
.lg-gate .q { font-weight: 600; color: var(--ink); }
.lg-gate .actions { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.lg-gate.resolved { background: var(--success-soft); }

.lg-chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.lg-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 12px; font-weight: 550; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--line); color: var(--ink); transition: background var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast) var(--ease-out); animation: lg-rise var(--dur) var(--ease-out) both; }
.lg-chip:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.lg-chip.on { background: var(--tint); border-color: var(--accent); color: var(--accent); }
.lg-chip .x { opacity: 0.6; } .lg-chip .x:hover { opacity: 1; }

.lg-composer { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-2xl); box-shadow: var(--shadow-card); padding: 12px 12px 10px 16px; display: grid; gap: var(--space-2); transition: border-color var(--dur), box-shadow var(--dur); }
.lg-composer:focus-within { border-color: var(--accent); box-shadow: var(--shadow-pop); }
.lg-composer textarea { border: 0; outline: 0; resize: none; background: transparent; color: var(--ink); font: inherit; line-height: 21px; min-height: 42px; max-height: 160px; padding: 4px 0; }
.lg-composer textarea:focus-visible { box-shadow: none; }
.lg-composer textarea::placeholder { color: var(--muted); }
.lg-composer .bar { display: flex; align-items: center; gap: var(--space-1); }
.lg-composer .bar .end { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }
.lg-send { width: 34px; height: 34px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--brand); color: var(--on-brand); transition: transform var(--dur) var(--ease-spring), opacity var(--dur), background var(--dur-fast); }
.lg-send:hover { background: var(--brand-hover); }
.lg-send[disabled] { opacity: 0.35; transform: scale(0.9); cursor: default; }
.lg-send:not([disabled]):active { transform: scale(0.88); }
.lg-mode { position: relative; }
.lg-menu { position: absolute; bottom: calc(100% + 8px); right: 0; min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-pop); padding: 6px; display: grid; gap: 2px; transform-origin: bottom right; animation: lg-menu var(--dur) var(--ease-out); z-index: 5; }
.lg-menu button { display: grid; grid-template-columns: 20px 1fr; gap: 2px 8px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: var(--radius-md); }
.lg-menu button:hover, .lg-menu button.on { background: var(--surface-2); }
.lg-menu button small { grid-column: 2; color: var(--muted); font-size: 12px; }

.lg-convo { display: grid; grid-template-columns: auto 1fr auto; gap: 2px var(--space-2); align-items: center; padding: 9px var(--space-3); border-radius: var(--radius-md); cursor: pointer; transition: background var(--dur-fast); }
.lg-convo:hover { background: var(--surface-2); }
.lg-convo.active { background: var(--tint); }
.lg-convo .t { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-convo .m { grid-column: 2 / 4; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-convo .scope { width: 8px; height: 8px; border-radius: 3px; }

/* ===== Factory (docs/foreman-flow/SPEC.md) ===== */
/* Actor badge: code / agent / jev / human — who did it, at a glance */
.lg-actor { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; flex-shrink: 0; font-size: 11px; font-weight: 700; overflow: hidden; }
.lg-actor.code { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-strong); font: 700 10px var(--font-mono); }
.lg-actor.jev { background: var(--ink); color: var(--canvas); font: 600 13px var(--font-display); }
.lg-actor.human { background: var(--tint); color: var(--accent); border-radius: 50%; }
.lg-actor.agent { border-radius: 50%; }
.lg-actor.agent img { width: 100%; height: 118%; object-fit: cover; object-position: top; }
.lg-actor.foreman { background: var(--crew-foreman); } .lg-actor.architect { background: var(--crew-architect); } .lg-actor.builder { background: var(--crew-builder); } .lg-actor.inspector { background: var(--crew-inspector); } .lg-actor.cataloger { background: var(--crew-cataloger); }
.lg-actor.sm { width: 20px; height: 20px; font-size: 9px; border-radius: 6px; }
.lg-actor.sm.agent, .lg-actor.sm.human { border-radius: 50%; }
.lg-kind { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }

/* Stage stepper: the nine SPEC stages */
.lg-stages { display: grid; grid-template-columns: repeat(9, minmax(92px, 1fr)); gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.lg-stage { position: relative; display: grid; gap: 6px; padding: 10px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); min-width: 0; transition: border-color var(--dur), background var(--dur); }
.lg-stage::before { content: ""; position: absolute; left: 10px; right: 10px; top: 0; height: 3px; border-radius: 0 0 3px 3px; background: var(--chart-3); transition: background var(--dur); }
.lg-stage.done::before { background: var(--chart-1); }
.lg-stage.cur { border-color: var(--info); } .lg-stage.cur::before { background: var(--info); animation: lg-pulse 1.6s infinite; }
.lg-stage.wait { border-color: var(--warning); background: var(--warning-soft); } .lg-stage.wait::before { background: var(--warning); }
.lg-stage .nm { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-stage .who { display: flex; gap: 4px; }
.lg-dots { display: flex; gap: 3px; align-items: center; }
.lg-dots i { flex: 1; height: 6px; border-radius: 3px; background: var(--chart-3); transition: background var(--dur); }
.lg-dots i.done { background: var(--chart-1); } .lg-dots i.cur { background: var(--info); animation: lg-pulse 1.6s infinite; } .lg-dots i.wait { background: var(--warning); }

/* Jev gate: questions, probabilities, and the truth-table row code chose */
.lg-jev { border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); }
.lg-jev .gh { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.lg-jq { display: grid; grid-template-columns: minmax(0, 1fr) 120px 96px; gap: 12px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; }
.lg-jq:first-of-type { border-top: 0; }
.lg-jq .qid { font: 11px var(--font-mono); color: var(--muted); }
.lg-pbar { height: 6px; border-radius: 3px; background: var(--chart-3); position: relative; }
.lg-pbar::before, .lg-pbar::after { content: ""; position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--line-strong); }
.lg-pbar::before { left: 30%; } .lg-pbar::after { left: 70%; }
.lg-pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--chart-1); transition: width var(--dur) var(--ease-out); }
.lg-jev .row { padding: 12px 14px; background: var(--surface-2); font-size: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.lg-jev .row code { font: 11px var(--font-mono); }

/* Escalation banner: the only place a person is asked mid-flow */
.lg-banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--radius-lg); border: 1px solid var(--line); background: var(--surface); animation: lg-rise var(--dur) var(--ease-out) both; }
.lg-banner.esc { background: var(--warning-soft); border-color: var(--warning); }
.lg-banner.ok { background: var(--success-soft); border-color: transparent; }
.lg-banner .body { flex: 1; min-width: 0; display: grid; gap: 8px; }
.lg-banner .q { font-weight: 600; }
.lg-banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.lg-banner textarea { min-height: 60px; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); resize: vertical; }

/* Work order row */
.lg-worow { display: grid; grid-template-columns: 64px minmax(0, 1fr) 200px 150px 28px; gap: 14px; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); cursor: pointer; transition: transform var(--dur) var(--ease-out), border-color var(--dur), box-shadow var(--dur); }
.lg-worow:hover { transform: translateY(-1px); border-color: var(--line-strong); box-shadow: var(--shadow-card); }
.lg-worow.attn { border-color: var(--warning); background: linear-gradient(90deg, var(--warning-soft), var(--surface) 40%); }
.lg-worow .id { font: 12px var(--font-mono); color: var(--muted); }
.lg-worow .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lg-worow .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 720px) {
  .lg-worow { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
  .lg-worow .lg-dots { display: none; }
  .lg-jq { grid-template-columns: minmax(0, 1fr) 70px; } .lg-jq .ans { grid-column: 1 / 3; }
}

/* Motion */
@keyframes lg-spin { to { transform: rotate(360deg); } }
@keyframes lg-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }
@keyframes lg-pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes lg-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes lg-blink { 50% { opacity: 0; } }
@keyframes lg-typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
@keyframes lg-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@keyframes lg-sweep { from { background-position: -50% 0; } to { background-position: 150% 0; } }
@keyframes lg-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
@keyframes lg-menu { from { opacity: 0; transform: scale(0.96) translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .lg *, .lg *::before, .lg *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
}

/* ---------- factory ---------- */
/* ---------- factory (SPEC: Foreman-led flow) ---------- */

 {id:"d1",title:"Loan lifecycle",tag:"Concepts",updated:Date.now()-2*DAY,refs:["c1"],body:"A loan moves through a fixed set of states. Every move is a transition in the loan state machine, so each step is auditable and can be replayed.\n\n## States\n- **Application**: the borrower submits; documents are collected.\n- **Scoring**: risk is assessed and a limit is proposed.\n- **Approval**: a person or a rule approves the limit and terms.\n- **Disbursement**: money moves to the borrower.\n- **Repayment**: instalments follow the billing schedule.\n- **Closed**: settled, written off, or restructured.\n\n## Rules that matter\n- A loan never skips a state. If a step is not needed, the transition still happens and is recorded.\n- Repayment allocates to fees first, then interest, then principal.\n- Restructuring creates a new schedule; the old one is kept for audit.\n\n## Open questions\n- Should partial disbursement be its own state, or a flag on Disbursement?"},
 {id:"d2",title:"Foreman-led factory flow",tag:"Process",updated:Date.now()-1*DAY,refs:["WO-42","WO-44"],body:"The Foreman leads every work order. Agents write; Jev judges; Go code decides.\n\n## Five stages\n1. **Brief**: the factory prepares the workspace; the Foreman writes the brief.\n2. **Plan**: the Architect drafts spec and tasks; the plan gate decides.\n3. **Build**: Builders work one task at a time, in dependency order, inside each task's scope. Checks run after.\n4. **Review**: Inspector specialists and the Architect review in parallel.\n5. **Ship**: Foreman and Jev decide the merge at the done gate.\n\n## Gates\n- Jev answers typed questions with probabilities: yes above 0.7, no below 0.3.\n- Code walks a truth table and picks approve, revise, fix or escalate.\n- Revisions and fixes are capped at 2. A spent budget escalates.\n\n## When a person is asked\n- A plan touches schema, auth, payments or secrets.\n- The Architect asks something the Foreman cannot answer.\n- The done gate escalates."},
 {id:"d3",title:"Retry policy for checks",tag:"Decisions",updated:Date.now()-3*DAY,refs:["WO-41"],body:"Decided on Nov 4 after a run where retries used stale check output.\n\n## Decision\n- A retry uses **each check's latest run**, not the first failure.\n- Task retries keep the **plain prompt**; the failing check's name, command and output tail are appended.\n- Orphaned Foreman sessions close on their own once the plan is parked.\n\n## Why\nRetries were fixing problems that had already been fixed, and prompts grew with every attempt.\n\n## Consequences\n- Builder prompts stay short and predictable.\n- The fix budget (2) is shared between failed checks and done-gate fixes."},
 {id:"d4",title:"Jev gate thresholds",tag:"Decisions",updated:Date.now()-5*DAY,refs:["WO-42"],body:"Jev is TypeSafe's System One model, pinned to `jev-1.14.0`.\n\n## Thresholds\n- **yes** when p > 0.7\n- **no** when p < 0.3\n- **unsettled** otherwise. Unsettled always means revise or fix, never approve.\n\n## Failure handling\n- A failed Jev call escalates. It is never read as \"no\".\n- Over the context limit escalates; criteria are never silently cut.\n- No API key means every plan escalates and the done gate uses deterministic rules.\n\n## Cost\nRoughly 5–20k tokens per gate, well under one cent."},
 {id:"d5",title:"Legos design principles",tag:"Design",updated:Date.now()-0.3*DAY,refs:[],body:"How the Legos interface should feel.\n\n## Space and symmetry\n- Roomy: 40px gutters, 24px gaps, centered content.\n- Edges line up: fields match the button above them; cards align to the KPI grid.\n\n## Show who did what\nEvery step carries an actor badge: code, agent, Jev, or you.\n\n## Ask only when it matters\nGates decide routine steps. People see a banner only when a decision is theirs.\n\n## Motion\nQuick and purposeful: rise on enter, pulse while running, pop on done. Reduced motion turns it off."},
 {id:"d6",title:"Go conventions",tag:"Engineering",updated:Date.now()-9*DAY,refs:[],body:"Conventions for the Go services.\n\n## Where logic lives\n- Business rules live in `internal/adapter/usecase`, never in repositories.\n- Repositories only read and write.\n\n## Shape of code\n- Prefer one well-placed file over many small packages under ~500 lines.\n- When porting from another service, keep upstream signatures identical and adapt at the call site.\n\n## Tests\n- Table tests per usecase.\n- Fakes over mocks where a port is small."},
 {id:"d7",title:"December family budget",tag:"Personal",updated:Date.now()-12*DAY,refs:[],body:"Plan for the end of the year.\n\n## Order of money\n1. Fixed costs: rent, school, utilities.\n2. Savings: 20% before any spending.\n3. Flexible spending for the rest.\n\n## Holiday line\nCapped at 12% of monthly income. Gifts come from this line, not from savings.\n\n## Review\nCheck on the 15th and the 28th."},
