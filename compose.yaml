services:
  factory:
    build: .
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FACTORY_AUTH_MODE: dev
      FACTORY_FRONTEND_ORIGIN: http://localhost:8080
      FACTORY_SANDBOX_MODE: local
      FACTORY_HARNESS: acp
    volumes:
      - factory-data:/data
      # OpenCode sessions and provider logins (`opencode auth login` inside the container)
      - opencode-data:/root/.local/share/opencode
      - opencode-config:/root/.config/opencode
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

volumes:
  factory-data:
  opencode-data:
  opencode-config:
